spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/social_mmo}
    username: ${DB_USER:mmo}
    password: ${DB_PASSWORD:local_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
management:
  endpoints:
    web:
      exposure:
        include: health,info
